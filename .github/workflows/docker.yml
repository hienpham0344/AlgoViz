name: Docker

# Builds the all-in-one image on pull requests and manual runs. Pushes to main
# are covered by deploy-azure.yml, which builds, smoke-tests and deploys.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: algoviz:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container and probe health
        run: |
          docker run -d --name algoviz-ci -p 8080:8080 \
            -e ALGOVIZ_JWT_SECRET="$(openssl rand -hex 32)" algoviz:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/ast/health; then exit 0; fi
            sleep 5
          done
          echo "Container did not become healthy" >&2
          docker logs algoviz-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f algoviz-ci
