server:
  port: 8080

spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: algoViz
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:algovizdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

algoviz:
  execution:
    python-command: ${ALGOVIZ_PYTHON_COMMAND:python}
    cpp-command: ${ALGOVIZ_CPP_COMMAND:g++}
    timeout-seconds: ${ALGOVIZ_EXECUTION_TIMEOUT_SECONDS:5}
  sandbox:
    docker:
      enabled: ${ALGOVIZ_DOCKER_SANDBOX_ENABLED:false}
      docker-command: ${ALGOVIZ_DOCKER_COMMAND:docker}
      image: ${ALGOVIZ_DOCKER_JAVA_IMAGE:eclipse-temurin:21-alpine}
      memory: ${ALGOVIZ_DOCKER_MEMORY:256m}
      cpus: ${ALGOVIZ_DOCKER_CPUS:1.0}
      pids-limit: ${ALGOVIZ_DOCKER_PIDS_LIMIT:64}
      timeout-kill-seconds: ${ALGOVIZ_DOCKER_TIMEOUT_KILL_SECONDS:3}
  gamification:
    points-per-accepted: ${ALGOVIZ_POINTS_PER_ACCEPTED:10}
  security:
    rate-limit:
      enabled: ${ALGOVIZ_RATE_LIMIT_ENABLED:true}
      auth:
        requests-per-minute: ${ALGOVIZ_RATE_LIMIT_AUTH_RPM:20}
      submissions:
        requests-per-minute: ${ALGOVIZ_RATE_LIMIT_SUBMISSIONS_RPM:20}
      default:
        requests-per-minute: ${ALGOVIZ_RATE_LIMIT_DEFAULT_RPM:120}
  cache:
    ttl-minutes: ${ALGOVIZ_CACHE_TTL_MINUTES:10}
    max-size: ${ALGOVIZ_CACHE_MAX_SIZE:1000}
  jwt:
    secret: ${ALGOVIZ_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${ALGOVIZ_JWT_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${ALGOVIZ_JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${ALGOVIZ_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  import:
    enabled: ${ALGOVIZ_IMPORT_ENABLED:false}
    source: ${ALGOVIZ_IMPORT_SOURCE:mock}
    data-directory: ${ALGOVIZ_DATA_DIRECTORY:./data}
    problems-file: ${ALGOVIZ_PROBLEMS_FILE:problems.json}
    solutions-file: ${ALGOVIZ_SOLUTIONS_FILE:solutions.json}
    mock-data-directory: ${ALGOVIZ_MOCK_DATA_DIRECTORY:./data/mock}
    mock-problems-file: ${ALGOVIZ_MOCK_PROBLEMS_FILE:problems.json}
    mock-solutions-file: ${ALGOVIZ_MOCK_SOLUTIONS_FILE:solutions.json}
