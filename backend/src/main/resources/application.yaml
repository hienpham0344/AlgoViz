server:
  port: 8080

spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: algoViz

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Cấu hình Swagger OpenAPI UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Import bộ dữ liệu phát triển. Bật tường minh bằng ALGOVIZ_SEED_ENABLED=true.
algoviz:
  seed:
    enabled: ${ALGOVIZ_SEED_ENABLED:false}
    data-directory: ${ALGOVIZ_DATA_DIRECTORY:}

