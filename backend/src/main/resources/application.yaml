server:
  port: 8080

spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: algoViz

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Cấu hình Swagger OpenAPI UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Import dữ liệu chỉ được bật rõ ràng bằng ALGOVIZ_IMPORT_ENABLED=true trong file .env.
algoviz:
  # Các giá trị được đọc từ backend/.env; fallback giữ import tắt khi thiếu cấu hình.
  import:
    enabled: ${ALGOVIZ_IMPORT_ENABLED}
    source: ${ALGOVIZ_IMPORT_SOURCE}
    data-directory: ${ALGOVIZ_DATA_DIRECTORY}
    problems-file: ${ALGOVIZ_PROBLEMS_FILE}
    solutions-file: ${ALGOVIZ_SOLUTIONS_FILE}
    mock-data-directory: ${ALGOVIZ_MOCK_DATA_DIRECTORY}
    mock-problems-file: ${ALGOVIZ_MOCK_PROBLEMS_FILE}
    mock-solutions-file: ${ALGOVIZ_MOCK_SOLUTIONS_FILE}

