# AlgoViz: `docker compose up --build` (in-memory H2) or
# `docker compose --profile postgres up --build` (PostgreSQL, data kept in a volume).
# Copy .env.example to .env first; ALGOVIZ_JWT_SECRET is required.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: algoviz:local
    ports:
      - "${ALGOVIZ_PORT:-8080}:8080"
    environment:
      ALGOVIZ_JWT_SECRET: ${ALGOVIZ_JWT_SECRET:?Set ALGOVIZ_JWT_SECRET in .env (openssl rand -hex 32)}
      ALGOVIZ_CORS_ALLOWED_ORIGINS: ${ALGOVIZ_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      ALGOVIZ_EXECUTION_TIMEOUT_SECONDS: ${ALGOVIZ_EXECUTION_TIMEOUT_SECONDS:-5}
      SPRING_DATASOURCE_DRIVER: ${SPRING_DATASOURCE_DRIVER:-org.h2.Driver}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-sa}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    mem_limit: ${ALGOVIZ_MEMORY_LIMIT:-1g}
    pids_limit: 512
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m
    restart: unless-stopped

  # Optional database. Enable with `--profile postgres`, then set in .env:
  #   SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/algoviz
  #   SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
  #   SPRING_DATASOURCE_USERNAME=algoviz
  #   SPRING_DATASOURCE_PASSWORD=<same as POSTGRES_PASSWORD>
  postgres:
    profiles: [postgres]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: algoviz
      POSTGRES_USER: algoviz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - algoviz-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algoviz -d algoviz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  algoviz-pgdata:
